<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Özel Sohbet Odası</title>
  <style>
    :root {
      --primary-color: #007bff;
      --bg-color: #e5ddd5;
      --chat-bg: #ece5dd;
      --my-msg: #dcf8c6;
      --other-msg: #ffffff;
    }
    * { box-sizing: border-box; font-family: sans-serif; margin: 0; padding: 0; }
    body { background-color: var(--bg-color); display: flex; justify-content: center; align-items: center; height: 100vh; }
    
    .app-container { width: 100%; max-width: 400px; height: 90vh; background: white; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); overflow: hidden; display: flex; flex-direction: column; }
    .screen { padding: 30px; display: flex; flex-direction: column; justify-content: center; height: 100%; text-align: center; }
    .hidden { display: none !important; }

    h2 { color: #333; margin-bottom: 20px; }
    p.subtitle { color: #666; font-size: 14px; margin-bottom: 20px; }
    
    input[type="text"], input[type="password"] { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; outline: none; }
    button.action-btn { width: 100%; padding: 12px; background-color: var(--primary-color); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
    
    .error { color: #d9534f; font-size: 14px; margin-bottom: 15px; min-height: 20px; }

    .chat-header { background: #075e54; color: white; padding: 15px; text-align: center; font-weight: bold; font-size: 18px; }
    .chat-area { flex: 1; background-color: var(--chat-bg); padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    
    .message { max-width: 75%; padding: 8px 12px; border-radius: 8px; font-size: 15px; display: flex; flex-direction: column; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
    .message.self { background-color: var(--my-msg); align-self: flex-end; border-top-right-radius: 0; }
    .message.other { background-color: var(--other-msg); align-self: flex-start; border-top-left-radius: 0; }
    
    .msg-role { font-size: 11px; font-weight: bold; color: #555; margin-bottom: 3px; }
    .msg-time { font-size: 10px; color: #999; align-self: flex-end; margin-top: 4px; }
    
    .input-area { background: #f0f0f0; padding: 10px; display: flex; gap: 10px; }
    .input-area input { margin: 0; border-radius: 20px; padding: 10px 15px; border: none; flex: 1; }
    .send-btn { background: #075e54; color: white; border: none; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; }
  </style>

  <!-- Firebase SDK Kütüphaneleri -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <div class="app-container">
    
    <!-- 1. Aşama -->
    <div id="step-1" class="screen">
      <h2>Güvenlik Girişi</h2>
      <p class="subtitle">Sisteme erişmek için şifreyi girin.</p>
      <input type="password" id="code1-input" placeholder="Giriş Kodu">
      <div id="error-1" class="error"></div>
      <button class="action-btn" onclick="checkStep1()">İleri</button>
    </div>

    <!-- 2. Aşama -->
    <div id="step-2" class="screen hidden">
      <h2>Kimlik Belirleme</h2>
      <p class="subtitle">Sohbete hangi harf ile katılacaksın?</p>
      <input type="text" id="code2-input" placeholder="K veya Ç giriniz" maxlength="1">
      <div id="error-2" class="error"></div>
      <button class="action-btn" onclick="checkStep2()">Sohbete Bağlan</button>
    </div>

    <!-- 3. Aşama -->
    <div id="step-3" class="hidden" style="display: flex; flex-direction: column; height: 100%;">
      <div class="chat-header">
        Özel Sohbet Odası (<span id="user-role-display"></span>)
      </div>
      <div id="chat-area" class="chat-area"></div>
      <div class="input-area">
        <input type="text" id="msg-input" placeholder="Bir mesaj yazın...">
        <button class="send-btn" onclick="sendMessage()">➤</button>
      </div>
    </div>

  </div>

  <script>
    // Telefonda hata olursa direkt ekrana uyarı verecek güvenlik kodu
    window.onerror = function(msg, url, line) {
      alert("Kod Hatası: " + msg + " (Satır: " + line + ")");
    };

    // Firebase Bağlantısı
    let db = null;
    try {
      const firebaseConfig = {
        databaseURL: "https://tomoyunu-5cd2f-default-rtdb.firebaseio.com"
      };
      firebase.initializeApp(firebaseConfig);
      db = firebase.database().ref("global_chat");
    } catch(e) {
      console.log("Firebase başlatılamadı:", e);
    }

    const validCodesStep1 = ["Cokgüzelsin", "Yalan", "Tempo", "Üçkalp", "Kalpsizsin", "Asksakızı", "Olmazoğlan"];
    let userRole = "";
    let allMessages = [];

    function checkStep1() {
      const val = document.getElementById("code1-input").value.trim();
      if (validCodesStep1.includes(val)) {
        document.getElementById("step-1").classList.add("hidden");
        document.getElementById("step-2").classList.remove("hidden");
      } else {
        document.getElementById("error-1").innerText = "Hatalı giriş kodu!";
      }
    }

    function checkStep2() {
      const val = document.getElementById("code2-input").value.trim().toUpperCase();
      if (val === "K" || val === "Ç") {
        userRole = val;
        document.getElementById("user-role-display").innerText = userRole;
        document.getElementById("step-2").classList.add("hidden");
        document.getElementById("step-3").classList.remove("hidden");
        initChat();
      } else {
        document.getElementById("error-2").innerText = "Sadece 'K' veya 'Ç' girin.";
      }
    }

    function initChat() {
      loadLocalMessages();
      
      if (db) {
        db.on("value", (snapshot) => {
          const data = snapshot.val();
          if (data) {
            allMessages = Object.values(data);
            localStorage.setItem("chat_history", JSON.stringify(allMessages));
            renderMessages(allMessages);
          }
        }, (error) => {
          alert("Firebase Veritabanı Hatası: " + error.message);
        });
      }
    }

    function sendMessage() {
      const input = document.getElementById("msg-input");
      const text = input.value.trim();
      if (!text) return;

      const newMsg = {
        role: userRole,
        text: text,
        timestamp: Date.now()
      };

      // 1. Firebase'e gönder
      if (db) {
        db.push(newMsg);
      }

      // 2. Anında Ekrana Çiz ve LocalStorage'a kaydet (Arayüz asla kilitlenmesin)
      allMessages.push(newMsg);
      localStorage.setItem("chat_history", JSON.stringify(allMessages));
      renderMessages(allMessages);

      input.value = "";
    }

    function formatTime(timestamp) {
      const date = new Date(timestamp);
      return date.getHours().toString().padStart(2, '0') + ':' + date.getMinutes().toString().padStart(2, '0');
    }

    function renderMessages(messages) {
      const chatArea = document.getElementById("chat-area");
      chatArea.innerHTML = "";
      
      messages.forEach((msg) => {
        const msgDiv = document.createElement("div");
        const isSelf = msg.role === userRole;
        msgDiv.className = `message ${isSelf ? 'self' : 'other'}`;
        
        const roleLabel = !isSelf ? `<div class="msg-role">${msg.role}</div>` : '';
        
        msgDiv.innerHTML = `
          ${roleLabel}
          <div>${escapeHtml(msg.text)}</div>
          <div class="msg-time">${formatTime(msg.timestamp)}</div>
        `;
        chatArea.appendChild(msgDiv);
      });
      
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    function loadLocalMessages() {
      const localData = localStorage.getItem("chat_history");
      if (localData) {
        allMessages = JSON.parse(localData);
        renderMessages(allMessages);
      }
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    document.getElementById("msg-input").addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
