<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sohbet Uygulaması</title>
  <style>
    * { box-sizing: border-box; font-family: sans-serif; }
    body { background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 320px; text-align: center; }
    .hidden { display: none !important; }
    input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; }
    button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background-color: #0056b3; }
    #chat-box { height: 300px; border: 1px solid #ddd; border-radius: 4px; overflow-y: auto; padding: 10px; text-align: left; margin-bottom: 10px; background: #fafafa; }
    .msg { margin-bottom: 8px; font-size: 14px; }
    .msg-role { font-weight: bold; color: #007bff; }
    .error { color: red; font-size: 12px; margin-top: 5px; }
  </style>

  <!-- Firebase SDK JS (v8) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

  <!-- Aşama 1: İlk Kod Girişi -->
  <div id="step-1" class="card">
    <h3>1. Aşama Giriş</h3>
    <input type="password" id="code1-input" placeholder="Giriş kodunu giriniz">
    <button onclick="checkStep1()">İlerle</button>
    <div id="error-1" class="error"></div>
  </div>

  <!-- Aşama 2: Rol Seçim Kodu -->
  <div id="step-2" class="card hidden">
    <h3>2. Aşama Rol Seçimi</h3>
    <input type="text" id="code2-input" placeholder="K veya Ç giriniz" maxlength="1">
    <button onclick="checkStep2()">Sohbete Katıl</button>
    <div id="error-2" class="error"></div>
  </div>

  <!-- Aşama 3: Sohbet Odası -->
  <div id="step-3" class="card hidden" style="width: 400px;">
    <h3>Genel Sohbet (<span id="user-role-display"></span>)</h3>
    <div id="chat-box"></div>
    <div style="display: flex; gap: 5px;">
      <input type="text" id="msg-input" placeholder="Mesaj yazın..." style="margin:0;">
      <button onclick="sendMessage()" style="width: 80px;">Gönder</button>
    </div>
  </div>

  <script>
    // Firebase Yapılandırması
    const firebaseConfig = {
      databaseURL: "https://tomoyunu-5cd2f-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref("global_chat");

    // Geçerli Kodlar
    const validCodesStep1 = ["Cokgüzelsin", "Yalan", "Tempo", "Üçkalp", "Kalpsizsin", "Asksakızı", "Olmazoğlan"];
    let userRole = "";

    // Aşama 1 Doğrulama
    function checkStep1() {
      const val = document.getElementById("code1-input").value.trim();
      if (validCodesStep1.includes(val)) {
        document.getElementById("step-1").classList.add("hidden");
        document.getElementById("step-2").classList.remove("hidden");
      } else {
        document.getElementById("error-1").innerText = "Hatalı kod girdiniz.";
      }
    }

    // Aşama 2 Doğrulama
    function checkStep2() {
      const val = document.getElementById("code2-input").value.trim().toUpperCase();
      if (val === "K" || val === "Ç") {
        userRole = val;
        document.getElementById("user-role-display").innerText = userRole;
        document.getElementById("step-2").classList.add("hidden");
        document.getElementById("step-3").classList.remove("hidden");
        initChat();
      } else {
        document.getElementById("error-2").innerText = "Sadece 'K' veya 'Ç' girebilirsiniz.";
      }
    }

    // Sohbet Başlatma ve Sync
    function initChat() {
      // Yerel Kayıtları Yükle
      loadLocalMessages();

      // Firebase Dinleyici (Veri değiştikçe tetiklenir)
      db.on("value", (snapshot) => {
        const data = snapshot.val();
        if (data) {
          const msgArray = Object.values(data);
          // LocalStorage Güncelle
          localStorage.setItem("chat_history", JSON.stringify(msgArray));
          renderMessages(msgArray);
        }
      });
    }

    // Mesaj Gönderme
    function sendMessage() {
      const input = document.getElementById("msg-input");
      const text = input.value.trim();
      if (!text) return;

      const newMsg = {
        role: userRole,
        text: text,
        timestamp: Date.now()
      };

      // Firebase'e Yazma
      db.push(newMsg);
      input.value = "";
    }

    // Mesajları Ekrana Bastırma
    function renderMessages(messages) {
      const chatBox = document.getElementById("chat-box");
      chatBox.innerHTML = "";
      messages.forEach((msg) => {
        const div = document.createElement("div");
        div.className = "msg";
        div.innerHTML = `<span class="msg-role">[${msg.role}]:</span> ${escapeHtml(msg.text)}`;
        chatBox.appendChild(div);
      });
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // LocalStorage'dan İlk Yükleme
    function loadLocalMessages() {
      const localData = localStorage.getItem("chat_history");
      if (localData) {
        renderMessages(JSON.parse(localData));
      }
    }

    // Güvenlik için XSS Temizliği
    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Enter tuşu desteği
    document.getElementById("msg-input").addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
