<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>The Pets: Bumper Arena .IO</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #b3e5fc; /* Bebek Mavisi Arka Plan */
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        #game-canvas {
            display: block;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin: 0 auto;
        }

        /* Kullanıcı Arayüzü */
        .ui-container {
            position: fixed;
            top: 15px;
            left: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
            z-index: 10;
        }

        .stat-box {
            background: rgba(20, 27, 45, 0.85);
            color: #ffffff;
            padding: 8px 15px;
            border-radius: 12px;
            font-weight: 900;
            font-size: 13px;
            border: 2px solid #0288d1;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Liderlik Tablosu */
        .leaderboard {
            position: fixed;
            top: 15px;
            right: 15px;
            background: rgba(20, 27, 45, 0.85);
            color: white;
            border-radius: 15px;
            padding: 12px;
            width: 190px;
            border: 2px solid #0288d1;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            font-size: 12px;
            pointer-events: none;
            z-index: 10;
        }

        .leaderboard h3 {
            margin: 0 0 8px 0;
            text-align: center;
            color: #b3e5fc;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 1px;
            border-bottom: 1px dashed #0288d1;
            padding-bottom: 4px;
        }

        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            margin: 4px 0;
            font-weight: bold;
        }

        /* Emoji Gönderme Çubuğu */
        .emoji-bar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            background: rgba(20, 27, 45, 0.85);
            padding: 8px 12px;
            border-radius: 20px;
            border: 2px solid #0288d1;
            z-index: 10;
        }

        .emoji-btn {
            font-size: 20px;
            background: #0288d1;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s;
            box-shadow: 0 3px 0 #01579b;
        }

        .emoji-btn:active {
            transform: scale(0.9) translateY(3px);
            box-shadow: none;
        }

        #instructions {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(1, 87, 155, 0.9);
            color: white;
            padding: 8px 20px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 12px;
            text-align: center;
            pointer-events: none;
            z-index: 5;
        }

        /* Ses Açma/Kapatma Butonu */
        .audio-control {
            background: #0288d1;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 11px;
            pointer-events: auto;
            box-shadow: 0 2px 0 #01579b;
        }
    </style>
</head>
<body>

    <div class="ui-container">
        <div class="stat-box">🆔 Pet: <span id="player-pet-name">...</span> (<span id="player-id">...</span>)</div>
        <div class="stat-box">⚖️ Kütle: <span id="player-score">100</span></div>
        <div class="stat-box">⚡ Dash (Ekrana Tıkla!)</div>
        <div class="stat-box" style="border:none; background:transparent; padding:0; box-shadow:none;">
            <button class="audio-control" id="mute-btn" onclick="toggleMute()">🔊 Müzik Açık</button>
        </div>
    </div>

    <div class="leaderboard">
        <h3>🏆 En Büyük Petler</h3>
        <div id="lb-list"></div>
    </div>

    <div id="instructions">
        🎵 Müziği başlatmak için ekrana bir kez dokun/tıkla! <br>🚀 Hızlanıp rakipleri uçurmak için TIKLAMAYA devam et!
    </div>

    <div class="emoji-bar">
        <button class="emoji-btn" onclick="sendEmoji('😡')">😡</button>
        <button class="emoji-btn" onclick="sendEmoji('🤪')">🤪</button>
        <button class="emoji-btn" onclick="sendEmoji('😎')">😎</button>
        <button class="emoji-btn" onclick="sendEmoji('👑')">👑</button>
        <button class="emoji-btn" onclick="sendEmoji('💥')">💥</button>
    </div>

    <canvas id="game-canvas"></canvas>

    <script>
        // FIREBASE BAĞLANTISI
        const firebaseConfig = { databaseURL: "https://tomoyunu-5cd2f-default-rtdb.europe-west1.firebasedatabase.app/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // MÜZİK AYARLARI
        const bgMusic = new Audio('background.mp3');
        bgMusic.loop = true;
        bgMusic.volume = 0.4; // %40 ses yüksekliği (rahatsız etmemesi için)
        let isMuted = false;
        let musicStarted = false;

        // Tarayıcıların "ilk tıklamadan önce ses çalmama" kuralı için etkileşim kontrolü
        function startMusic() {
            if (!musicStarted && !isMuted) {
                bgMusic.play().then(() => {
                    musicStarted = true;
                    document.getElementById('instructions').style.display = 'none'; // İlk tıklamada talimatı gizle
                }).catch(err => console.log("Ses başlatılamadı, etkileşim bekleniyor..."));
            }
        }

        function toggleMute() {
            isMuted = !isMuted;
            const btn = document.getElementById('mute-btn');
            if (isMuted) {
                bgMusic.pause();
                btn.innerText = "🔇 Müzik Kapalı";
                btn.style.background = "#d63031";
            } else {
                bgMusic.play();
                btn.innerText = "🔊 Müzik Açık";
                btn.style.background = "#0288d1";
                musicStarted = true;
            }
        }

        // Karakter listesi ve .webp uzantıları
        const petPool = ['yeyet', 'blook', 'moosey', 'blinky', 'dot', 'sugar', 'gus', 'flip', 'squeak'];
        
        // Görselleri Ön Belleğe Yükleme (Preload)
        const images = {};
        petPool.forEach(pet => {
            images[pet] = new Image();
            images[pet].src = pet + '.webp';
        });
        
        // Yiyecek görselini seker.webp olarak tanımlıyoruz
        images['food'] = new Image();
        images['food'].src = 'seker.webp';

        // Kimlik ve Rastgele Pet Seçimi
        let myId = localStorage.getItem('bumper_io_id');
        if(!myId) {
            myId = 'P-' + Math.floor(Math.random() * 900 + 100);
            localStorage.setItem('bumper_io_id', myId);
        }
        
        let myPet = localStorage.getItem('bumper_io_pet');
        if(!myPet || !petPool.includes(myPet)) {
            myPet = petPool[Math.floor(Math.random() * petPool.length)];
            localStorage.setItem('bumper_io_pet', myPet);
        }

        document.getElementById('player-id').innerText = myId;
        document.getElementById('player-pet-name').innerText = myPet.toUpperCase();

        const arena = {
            x: window.innerWidth / 2,
            y: window.innerHeight / 2,
            radius: Math.min(window.innerWidth, window.innerHeight) * 0.42
        };

        // Yerel Oyuncu Bilgisi
        let localPlayer = {
            id: myId,
            pet: myPet,
            x: arena.x + (Math.random() * 60 - 30),
            y: arena.y + (Math.random() * 60 - 30),
            vx: 0,
            vy: 0,
            mass: 100,
            radius: 20,
            emoji: "",
            emojiTimer: 0,
            isDead: false
        };

        let remotePlayers = {};
        let foods = {};
        let mouse = { x: arena.x, y: arena.y };

        // Kontroller
        window.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
        window.addEventListener('touchmove', (e) => {
            if(e.touches.length > 0) { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; }
        });

        window.addEventListener('mousedown', triggerDash);
        window.addEventListener('touchstart', triggerDash);

        function triggerDash(e) {
            startMusic(); // Oyuncu ekrana ilk tıkladığında müzik otomatik başlar
            
            if(e.target.tagName === 'BUTTON' || e.target.classList.contains('emoji-btn') || e.target.classList.contains('audio-control')) return;
            if(localPlayer.isDead || localPlayer.mass < 40) return;

            localPlayer.mass -= 12; 
            let dx = mouse.x - localPlayer.x;
            let dy = mouse.y - localPlayer.y;
            let dist = Math.sqrt(dx*dx + dy*dy);
            
            if(dist > 5) {
                localPlayer.vx += (dx / dist) * 13;
                localPlayer.vy += (dy / dist) * 13;
            }
        }

        function sendEmoji(emojiStr) {
            if(localPlayer.isDead) return;
            localPlayer.emoji = emojiStr;
            localPlayer.emojiTimer = Date.now() + 2500;
            syncToFirebase();
        }

        // --- NETWORK (FIREBASE) ---
        function syncToFirebase() {
            if(localPlayer.isDead) return;
            db.ref('arena_players/' + myId).set({
                id: localPlayer.id,
                pet: localPlayer.pet,
                x: localPlayer.x,
                y: localPlayer.y,
                mass: localPlayer.mass,
                emoji: Date.now() < localPlayer.emojiTimer ? localPlayer.emoji : "",
                lastSeen: Date.now()
            });
        }
        db.ref('arena_players/' + myId).onDisconnect().remove();

        db.ref('arena_players').on('value', (snap) => {
            const data = snap.val();
            if(!data) { remotePlayers = {}; return; }
            remotePlayers = data;
        });

        db.ref('arena_foods').on('value', (snap) => {
            const data = snap.val();
            if(data) foods = data;
        });

        // Şeker yönetimi ve zaman aşımı temizliği
        setInterval(() => {
            if(localPlayer.isDead) return;
            if(Object.keys(foods).length < 25 && Math.random() < 0.4) {
                let foodId = 'F-' + Math.floor(Math.random() * 1000000);
                let angle = Math.random() * Math.PI * 2;
                let r = Math.random() * (arena.radius - 15);
                db.ref('arena_foods/' + foodId).set({
                    id: foodId,
                    x: arena.x + Math.cos(angle) * r,
                    y: arena.y + Math.sin(angle) * r
                });
            }
            for(let id in remotePlayers) {
                if(Date.now() - remotePlayers[id].lastSeen > 8000) {
                    db.ref('arena_players/' + id).remove();
                }
            }
        }, 1000);

        // --- FİZİK MOTORU ---
        function updatePhysics() {
            if(localPlayer.isDead) return;

            localPlayer.radius = Math.sqrt(localPlayer.mass) * 2.5;
            document.getElementById('player-score').innerText = Math.floor(localPlayer.mass);

            let dx = mouse.x - localPlayer.x;
            let dy = mouse.y - localPlayer.y;
            let dist = Math.sqrt(dx*dx + dy*dy);

            if(dist > 10) {
                localPlayer.vx += (dx / dist) * 0.28;
                localPlayer.vy += (dy / dist) * 0.28;
            }

            localPlayer.vx *= 0.93;
            localPlayer.vy *= 0.93;
            localPlayer.x += localPlayer.vx;
            localPlayer.y += localPlayer.vy;

            // Şeker (Yem) Toplama
            for(let fId in foods) {
                let f = foods[fId];
                let fDist = Math.sqrt((f.x - localPlayer.x)**2 + (f.y - localPlayer.y)**2);
                if(fDist < localPlayer.radius) {
                    db.ref('arena_foods/' + fId).remove();
                    localPlayer.mass += 5;
                }
            }

            // Sumo İtme / Çarpışma Fiziği
            for(let rId in remotePlayers) {
                if(rId === myId) continue;
                let p = remotePlayers[rId];
                let pRadius = Math.sqrt(p.mass) * 2.5;

                let cDx = p.x - localPlayer.x;
                let cDy = p.y - localPlayer.y;
                let cDist = Math.sqrt(cDx*cDx + cDy*cDy);

                if(cDist < localPlayer.radius + pRadius) {
                    let overlap = (localPlayer.radius + pRadius) - cDist;
                    localPlayer.x -= (cDx / cDist) * overlap * 0.5;
                    localPlayer.y -= (cDy / cDist) * overlap * 0.5;

                    let forceFactor = 4.5;
                    let massRatioLocal = p.mass / (localPlayer.mass + p.mass);

                    localPlayer.vx -= (cDx / cDist) * forceFactor * massRatioLocal * 2.5;
                    localPlayer.vy -= (cDy / cDist) * forceFactor * massRatioLocal * 2.5;
                }
            }

            // Arenadan Düşme Kontrolü
            let arenaDist = Math.sqrt((localPlayer.x - arena.x)**2 + (localPlayer.y - arena.y)**2);
            if(arenaDist > arena.radius) {
                localPlayer.isDead = true;
                db.ref('arena_players/' + myId).remove();
                alert("❌ Arenadan aşağı düştün! Yeniden doğmak için sayfayı yenile.");
                location.reload();
            }

            syncToFirebase();
        }

        // --- GRAFİK ÇİZİM (RENDERING) ---
        function renderGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Arena Çizimi (Bebek Mavisi Temalı Güvenli Bölge)
            ctx.beginPath();
            ctx.arc(arena.x, arena.y, arena.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#e3f2fd';
            ctx.fill();
            ctx.lineWidth = 8;
            ctx.strokeStyle = '#0288d1';
            ctx.stroke();
            ctx.closePath();

            // Şekerleri Çiz (`seker.webp`)
            for(let fId in foods) {
                let f = foods[fId];
                if(images['food'].complete && images['food'].width > 0) {
                    // Şeker görselini dengeli bir boyutta (24x24 piksel) çiziyoruz
                    ctx.drawImage(images['food'], f.x - 12, f.y - 12, 24, 24);
                } else {
                    // Yedek şeker çizimi (Görsel henüz yüklenmediyse pembe daire)
                    ctx.beginPath();
                    ctx.arc(f.x, f.y, 7, 0, Math.PI * 2);
                    ctx.fillStyle = '#ff7675';
                    ctx.fill();
                    ctx.closePath();
                }
            }

            // Diğer Oyuncuları Çiz (.webp Görselleriyle)
            for(let rId in remotePlayers) {
                if(rId === myId) continue;
                let p = remotePlayers[rId];
                let pRadius = Math.sqrt(p.mass) * 2.5;

                if(images[p.pet] && images[p.pet].complete && images[p.pet].width > 0) {
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, pRadius, 0, Math.PI * 2);
                    ctx.clip();
                    ctx.drawImage(images[p.pet], p.x - pRadius, p.y - pRadius, pRadius * 2, pRadius * 2);
                    ctx.restore();
                } else {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, pRadius, 0, Math.PI * 2);
                    ctx.fillStyle = '#74b9ff';
                    ctx.fill();
                    ctx.closePath();
                }

                ctx.fillStyle = '#141b2d';
                ctx.font = 'bold 11px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(`${p.pet.toUpperCase()} (${p.id})`, p.x, p.y + pRadius + 14);

                if(p.emoji) {
                    ctx.font = '22px sans-serif';
                    ctx.fillText(p.emoji, p.x, p.y - pRadius - 8);
                }
            }

            // Kendi Petimizi Çiz (.webp Görseliyle)
            if(!localPlayer.isDead) {
                let pRadius = localPlayer.radius;
                
                if(images[localPlayer.pet] && images[localPlayer.pet].complete && images[localPlayer.pet].width > 0) {
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(localPlayer.x, localPlayer.y, pRadius, 0, Math.PI * 2);
                    
                    ctx.lineWidth = 4;
                    ctx.strokeStyle = '#ffffff';
                    ctx.stroke();
                    
                    ctx.clip();
                    ctx.drawImage(images[localPlayer.pet], localPlayer.x - pRadius, localPlayer.y - pRadius, pRadius * 2, pRadius * 2);
                    ctx.restore();
                } else {
                    ctx.beginPath();
                    ctx.arc(localPlayer.x, localPlayer.y, pRadius, 0, Math.PI * 2);
                    ctx.fillStyle = '#0984e3';
                    ctx.fill();
                    ctx.closePath();
                }

                ctx.fillStyle = '#01579b';
                ctx.font = 'bold 12px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(`SEN (${localPlayer.pet.toUpperCase()})`, localPlayer.x, localPlayer.y + pRadius + 16);

                if(localPlayer.emoji && Date.now() < localPlayer.emojiTimer) {
                    ctx.font = '24px sans-serif';
                    ctx.fillText(localPlayer.emoji, localPlayer.x, localPlayer.y - pRadius - 8);
                } else {
                    localPlayer.emoji = "";
                }
            }

            updateLeaderboardUI();
        }

        function updateLeaderboardUI() {
            let listArr = [];
            if(!localPlayer.isDead) {
                listArr.push({ name: 'SEN', mass: localPlayer.mass });
            }
            for(let id in remotePlayers) {
                if(id !== myId) {
                    listArr.push({ name: `${remotePlayers[id].pet.toUpperCase()} (${remotePlayers[id].id})`, mass: remotePlayers[id].mass });
                }
            }

            listArr.sort((a, b) => b.mass - a.mass);

            const lbList = document.getElementById('lb-list');
            lbList.innerHTML = "";
            listArr.slice(0, 5).forEach((p, idx) => {
                lbList.innerHTML += `
                    <div class="leaderboard-item">
                        <span>${idx + 1}. ${p.name}</span>
                        <span>${Math.floor(p.mass)}</span>
                    </div>
                `;
            });
        }

        function gameLoop() {
            updatePhysics();
            renderGame();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
