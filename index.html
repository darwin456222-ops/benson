<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canlı Sohbet Odası</title>
  <style>
    :root {
      --primary-color: #075e54;
      --bg-color: #e5ddd5;
      --chat-bg: #ece5dd;
      --my-msg: #dcf8c6;
      --other-msg: #ffffff;
    }
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
    body { background-color: var(--bg-color); display: flex; justify-content: center; align-items: center; height: 100vh; }
    
    .app-container { width: 100%; max-width: 400px; height: 90vh; background: white; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); overflow: hidden; display: flex; flex-direction: column; }
    .chat-header { background: var(--primary-color); color: white; padding: 15px; text-align: center; font-weight: bold; font-size: 18px; }
    .chat-area { flex: 1; background-color: var(--chat-bg); padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    
    .message { max-width: 80%; padding: 8px 12px; border-radius: 8px; font-size: 15px; display: flex; flex-direction: column; box-shadow: 0 1px 2px rgba(0,0,0,0.1); word-wrap: break-word; }
    .message.self { background-color: var(--my-msg); align-self: flex-end; border-top-right-radius: 0; }
    .message.other { background-color: var(--other-msg); align-self: flex-start; border-top-left-radius: 0; }
    
    .msg-user { font-size: 11px; font-weight: bold; color: #075e54; margin-bottom: 3px; }
    .msg-time { font-size: 10px; color: #999; align-self: flex-end; margin-top: 4px; }
    
    .input-area { background: #f0f0f0; padding: 10px; display: flex; gap: 10px; }
    .input-area input { margin: 0; border-radius: 20px; padding: 10px 15px; border: none; flex: 1; outline: none; }
    .send-btn { background: var(--primary-color); color: white; border: none; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; font-size: 16px; }
  </style>

  <!-- Firebase v8 SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

  <div class="app-container">
    <div class="chat-header">
      Ortak Sohbet (Kullanıcı: <span id="user-display">Yükleniyor...</span>)
    </div>
    <div id="chat-area" class="chat-area"></div>
    <div class="input-area">
      <input type="text" id="msg-input" placeholder="Bir mesaj yazın...">
      <button class="send-btn" onclick="sendMessage()">➤</button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      databaseURL: "https://tomoyunu-5cd2f-default-rtdb.firebaseio.com"
    };
    
    firebase.initializeApp(firebaseConfig);
    const dbMessages = firebase.database().ref("genel_sohbet");
    const dbCounter = firebase.database().ref("kullanici_sayaci");

    let myUserName = localStorage.getItem("chat_user_name");

    // Kullanıcı adı yoksa sıradaki numarayı al ve kaydet
    function initUser() {
      if (!myUserName) {
        dbCounter.transaction((currentValue) => {
          return (currentValue || 0) + 1;
        }, (error, committed, snapshot) => {
          if (committed) {
            myUserName = snapshot.val().toString();
            localStorage.setItem("chat_user_name", myUserName);
            document.getElementById("user-display").innerText = myUserName;
          }
        });
      } else {
        document.getElementById("user-display").innerText = myUserName;
      }
      
      startChat();
    }

    function startChat() {
      // Yerel mesaj hafızası
      const localData = localStorage.getItem("chat_history_simple");
      if (localData) {
        renderMessages(JSON.parse(localData));
      }

      // Canlı veri takibi
      dbMessages.on("value", (snapshot) => {
        const data = snapshot.val();
        if (data) {
          const messages = Object.values(data);
          localStorage.setItem("chat_history_simple", JSON.stringify(messages));
          renderMessages(messages);
        }
      });
    }

    function sendMessage() {
      const input = document.getElementById("msg-input");
      const text = input.value.trim();
      if (!text || !myUserName) return;

      const newMsg = {
        user: myUserName,
        text: text,
        timestamp: Date.now()
      };

      dbMessages.push(newMsg);
      input.value = "";
      input.focus();
    }

    function renderMessages(messages) {
      const chatArea = document.getElementById("chat-area");
      chatArea.innerHTML = "";
      
      messages.forEach((msg) => {
        const msgDiv = document.createElement("div");
        const isSelf = msg.user === myUserName;
        
        msgDiv.className = `message ${isSelf ? 'self' : 'other'}`;
        
        const userLabel = !isSelf ? `<div class="msg-user">Kullanıcı ${msg.user}</div>` : '';
        
        const date = new Date(msg.timestamp);
        const timeString = date.getHours().toString().padStart(2, '0') + ':' + date.getMinutes().toString().padStart(2, '0');

        msgDiv.innerHTML = `
          ${userLabel}
          <div>${escapeHtml(msg.text)}</div>
          <div class="msg-time">${timeString}</div>
        `;
        chatArea.appendChild(msgDiv);
      });
      
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    document.getElementById("msg-input").addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendMessage();
    });

    // Uygulama açıldığı anda çalıştır
    initUser();
  </script>
</body>
</html>
